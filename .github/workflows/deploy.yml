name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow-payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and upload
        uses: withastro/action@v6
        with:
          node-version: '24.22.1'
          build-cmd: pnpm run build

      - name: Prepare IndexNow URLs
        id: indexnow
        run: node scripts/indexnow.mjs prepare
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare Cache
        run: |
          curl --fail-with-body --request POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Checkout IndexNow script
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'

      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs submit
        env:
          INDEXNOW_PAYLOAD: ${{ needs.build.outputs.indexnow-payload }}
