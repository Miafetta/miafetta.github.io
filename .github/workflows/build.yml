name: Build and Check

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: ['22.23.4', '24.22.1']
    runs-on: ubuntu-latest
    name: Astro Check for Node.js ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Run Astro Check
        run: pnpm astro check

      - name: Check cache policy safety
        run: pnpm test:security

      - name: Run regression checks
        run: pnpm test

  build:
    strategy:
      matrix:
        node: ['22.23.4', '24.22.1']
    runs-on: ubuntu-latest
    name: Astro Build for Node.js ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site and search index
        run: pnpm build
